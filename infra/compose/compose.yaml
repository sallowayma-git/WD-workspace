services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${ASSISTANT_DB_NAME:-assistant_workbench}
      POSTGRES_USER: ${ASSISTANT_DB_USER:-assistant_app}
      POSTGRES_PASSWORD: ${ASSISTANT_DB_PASSWORD:?Set ASSISTANT_DB_PASSWORD in your local environment}
    ports:
      - "${ASSISTANT_DB_PORT:-5432}:5432"
    volumes:
      - assistant-workbench-postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  assistant-workbench-postgres:
