server:
  port: ${ASSISTANT_API_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: assistant-workbench-api
  datasource:
    url: jdbc:postgresql://${ASSISTANT_DB_HOST:127.0.0.1}:${ASSISTANT_DB_PORT:5432}/${ASSISTANT_DB_NAME:assistant_workbench}
    username: ${ASSISTANT_DB_USER:assistant_app}
    password: ${ASSISTANT_DB_PASSWORD:}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

assistant:
  business-timezone: ${ASSISTANT_BUSINESS_TIMEZONE:Asia/Shanghai}
  day-close-time: ${ASSISTANT_DAY_CLOSE_TIME:05:00:00}
  day-close-cron: ${ASSISTANT_DAY_CLOSE_CRON:0 0 5 * * *}
  day-close-cron-enabled: ${ASSISTANT_DAY_CLOSE_CRON_ENABLED:true}
  organization-id: ${ASSISTANT_ORGANIZATION_ID:00000000-0000-0000-0000-000000000001}
  organization-code: ${ASSISTANT_ORGANIZATION_CODE:LOCAL}
  organization-name: ${ASSISTANT_ORGANIZATION_NAME:Local Development}
  client-min-compatible-version: ${ASSISTANT_CLIENT_MIN_COMPATIBLE_VERSION:0.1.0}
  auth:
    allowed-origins: ${ASSISTANT_AUTH_ALLOWED_ORIGINS:http://127.0.0.1:5173,http://localhost:5173,tauri://localhost,http://tauri.localhost}
    access-token-ttl-seconds: ${ASSISTANT_AUTH_ACCESS_TOKEN_TTL_SECONDS:900}
    refresh-token-ttl-seconds: ${ASSISTANT_AUTH_REFRESH_TOKEN_TTL_SECONDS:2592000}
    max-login-failures: ${ASSISTANT_AUTH_MAX_LOGIN_FAILURES:5}
    lock-duration-seconds: ${ASSISTANT_AUTH_LOCK_DURATION_SECONDS:900}
  seed-dev:
    enabled: ${ASSISTANT_SEED_DEV_ENABLED:false}
    password: ${ASSISTANT_SEED_DEV_PASSWORD:}
