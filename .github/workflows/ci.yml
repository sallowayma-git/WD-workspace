name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      # check:web runs the local-runtime guard first: it walks the import graph
      # from main.tsx and fails if the product entry can reach an HTTP
      # transport, an auth store or a bare fetch() again (ACC-001/ACC-003).
      - run: pnpm run check:web
      - run: pnpm run check:packages
      - run: pnpm run test:web
      - run: pnpm --dir apps/web build

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:desktop
      - run: pnpm --dir apps/desktop tauri build --no-bundle
